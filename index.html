
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기후 탐험대 옷 입히기 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf2fb; --panel:#ffffff; --ink:#1f2a37; --muted:#5b6776; --line:#d5e1ee;
  --navy:#1f3a5f; --sun:#ffc93c; --tile:#f7fbff; --tileOn:#fff1c7; --good:#2f9e63; --bad:#e5484d;
  --cl:#2d9c6a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a24; --panel:#1b2633; --ink:#eef3f9; --muted:#a9b6c5; --line:#2c3a4a;
    --navy:#0d1b2c; --tile:#eef5fc; --tileOn:#ffe9a8;
  }
}
:root[data-theme="dark"]{
  --bg:#121a24; --panel:#1b2633; --ink:#eef3f9; --muted:#a9b6c5; --line:#2c3a4a;
  --navy:#0d1b2c; --tile:#eef5fc; --tileOn:#ffe9a8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.55}
h1,h2,h3,button,.jua{font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
button{cursor:pointer;color:inherit}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:clamp(22px,3.2vw,30px);letter-spacing:.5px}
header h1 span{color:var(--sun)}
.modes{display:flex;gap:6px;background:rgba(255,255,255,.1);padding:4px;border-radius:999px}
.modes button{border:0;background:transparent;color:#fff;padding:8px 16px;border-radius:999px;font-size:16px}
.modes button[aria-pressed="true"]{background:var(--sun);color:var(--navy)}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 14px;font-size:17px;display:flex;flex-direction:column;align-items:center;min-width:92px}
.chip .st{font-size:13px;color:var(--sun);letter-spacing:1px;min-height:18px;-webkit-text-stroke:.3px #b8860b}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.chip[aria-pressed="true"] .st{color:#fff;-webkit-text-stroke:0}

.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin-top:12px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}

.stageWrap{position:relative;border-radius:22px;overflow:hidden;border:4px solid var(--cl);background:#fff;transition:box-shadow .2s}
.stageWrap.over{box-shadow:0 0 0 6px var(--sun)}
.stage svg{display:block;width:100%;height:auto}
.stage .worn{cursor:pointer}
.stage .worn:hover{opacity:.85}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.bubble{position:absolute;left:14px;top:14px;background:#fff;color:#1f2a37;border:3px solid #1f2a37;border-radius:16px;padding:6px 12px;font-family:"Jua",sans-serif;font-size:17px;max-width:60%}
.bubble::after{content:"";position:absolute;right:-12px;bottom:10px;border:8px solid transparent;border-left-color:#1f2a37}
.gender{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.gender button{border:2px solid #1f2a37;background:#fff;color:#1f2a37;border-radius:999px;padding:4px 12px;font-size:15px}
.gender button[aria-pressed="true"]{background:var(--sun)}

.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.side{display:flex;flex-direction:column;gap:12px}
.mission h2{margin:0 0 4px;font-size:24px;color:var(--cl)}
.mission .goal{margin:0 0 10px;font-size:17px}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:400;font-family:"Jua",sans-serif;margin-right:4px}
.hint{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 10px;font-size:15px;position:relative}
.tabs button[aria-pressed="true"]{background:var(--cl);border-color:var(--cl);color:#fff}
.tabs button .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;min-height:130px}
.tile{touch-action:pan-y;user-select:none;-webkit-user-select:none;border:2px solid #cfdbe8;background:var(--tile);color:#1f2a37;border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:"Gowun Dodum",sans-serif;font-size:13px;line-height:1.25;text-align:center;position:relative}
.tile svg{width:74px;height:74px;pointer-events:none}
.tile.on{background:var(--tileOn);border-color:#e0a800}
.tile.on::after{content:"입었어요";position:absolute;top:4px;right:4px;font-size:10px;background:#e0a800;color:#fff;border-radius:6px;padding:1px 4px}
.nameRow{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}
.nameRow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.flash{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash{display:none}}
.shot{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
.btnCam{background:var(--sun);color:#1f2a37}
.tip{margin:10px 0 0;font-size:14px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1 1 140px;border:0;border-radius:14px;padding:14px;font-size:19px}
.btnGhost{background:var(--panel);border:2px solid var(--line)!important}
.btnMain{background:var(--cl);color:#fff}

#ghost{position:fixed;left:0;top:0;width:86px;height:86px;pointer-events:none;z-index:60;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
#ghost svg{width:100%;height:100%}

.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.modalCard{background:var(--panel);color:var(--ink);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;border-top:10px solid var(--cl)}
.stars{font-size:40px;letter-spacing:4px;color:var(--sun);text-align:center;-webkit-text-stroke:1px #b8860b}
.modalCard h3{text-align:center;margin:4px 0 14px;font-size:24px}
.lines{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.lines li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:15px}
.lines li.neg{background:rgba(229,72,77,.12)}
.lines li.pos{background:rgba(47,158,99,.12)}
.lines strong{font-family:"Jua",sans-serif;font-weight:400}
.box{border:2px dashed var(--cl);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.box b{font-family:"Jua",sans-serif;font-weight:400;color:var(--cl);display:block;font-size:17px}
.modalBtns{display:flex;gap:10px;margin-top:14px}
.modalBtns button{flex:1;border:0;border-radius:12px;padding:12px;font-size:17px}

/* quiz */
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qopts button{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 6px;font-size:17px}
.qopts button.right{background:var(--good);border-color:var(--good);color:#fff}
.qopts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.qfeed{margin-top:12px;font-size:15px}
.qhead{display:flex;justify-content:space-between;align-items:baseline}
.qhead h2{margin:0;font-size:24px}
.qhead span{color:var(--muted)}
footer{max-width:1180px;margin:0 auto;padding:8px 16px 28px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
footer button{border:0;background:none;text-decoration:underline;color:var(--muted);font-family:inherit;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>기후 탐험대 <span>옷 입히기 대작전</span></h1>
  <div class="modes" role="group" aria-label="활동 선택">
    <button id="modeMission" aria-pressed="true">옷 입히기 미션</button>
    <button id="modeQuiz" aria-pressed="false">여행자 퀴즈</button>
  </div>
</header>

<div class="wrap" id="missionView">
  <nav class="chips" id="chips" aria-label="기후 선택"></nav>
  <div class="main">
    <div class="stageWrap" id="stageWrap">
      <div class="stage" id="stage"></div>
      <div class="bubble" id="bubble"></div>
      <div class="gender" role="group" aria-label="친구 선택">
        <button data-g="g" aria-pressed="true">여자 친구</button>
        <button data-g="b" aria-pressed="false">남자 친구</button>
      </div>
    </div>
    <div class="side">
      <div class="card mission" id="missionCard"></div>
      <div class="card">
        <div class="tabs" id="tabs"></div>
        <div class="grid" id="grid"></div>
        <p class="tip">옷을 한 번 누르면 바로 입고, 끌어다 놓아도 돼요. 친구가 입은 옷을 누르면 벗어요.</p>
      </div>
      <div class="actions">
        <button class="btnGhost" id="resetBtn">모두 벗기기</button>
        <button class="btnCam" id="shotBtn">📸 사진 찍기</button>
        <button class="btnMain" id="checkBtn">다 입었어요! 확인하기</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap" id="quizView" hidden>
  <div class="main">
    <div class="stageWrap" style="--cl:#1f3a5f">
      <div class="stage" id="qstage"></div>
    </div>
    <div class="side">
      <div class="card">
        <div class="qhead"><h2>이 여행자는 어느 기후에서 왔을까?</h2><span id="qprog"></span></div>
        <p style="margin:6px 0 12px;color:var(--muted)">옷차림을 잘 살펴보고 알맞은 기후를 골라 보세요.</p>
        <div class="qopts" id="qopts"></div>
        <div class="qfeed" id="qfeed"></div>
      </div>
      <div class="actions"><button class="btnMain" id="qnext" style="background:var(--navy)" hidden>다음 여행자</button></div>
    </div>
  </div>
</div>

<footer>
  <span>활동 아이디어 참고: 김햇살 × i-Scream 〈기후별 옷 입히기 놀이〉 도안 · 그림은 새로 그린 것입니다.</span>
  <button id="clearStars">별 기록 지우기</button>
</footer>

<div class="modal" id="modal" hidden><div class="modalCard" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div id="ghost" hidden></div>

<script>
const S='stroke="#2a2522" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const NEUTRAL='이 기후에서는 꼭 필요하지 않아요.';

function evaluate(cl,o){

 for(const s of SLOT_ORDER){

  const it=ITEM[id];const f=it.fit[cl]||[0,NEUTRAL];
  score+=f[0];lines.push({s:f[0],name:it.name,text:f[1]});
  if(f[0]<0){if(f[2]==='c')cold-=f[0];if(f[2]==='h')hot-=f[0];}
 }
 const full=o.top&&ITEM[o.top].full;
 for(const s of ['top','bottom','feet']){
  if(s==='bottom'&&full)continue;
  if(!o[s]){score-=2;lines.push({s:-2,name:REQ_NAME[s],text:REQ[s]});if(COLDISH[cl])cold+=2;}
 }
 for(const [s,msg] of CL[cl].must){
  if(!o[s]){score-=1;lines.push({s:-1,name:'빠진 것',text:msg});if(COLDISH[cl])cold+=1;}
 }
 return {score,lines,cold,hot,count};
}

}

function wrap(ctx,text,x,y,maxW,lh,maxLines){let line='',n=0;for(const ch of text){if(ctx.measureText(line+ch).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=ch;if(++n>=maxLines-1){}}else line+=ch;}if(line)ctx.fillText(line,x,y);return y+lh;}

 ctx.fillStyle='#fffdf7';ctx.fillRect(0,0,W,H);
 ctx.fillStyle=c.color;ctx.fillRect(0,0,W,170);
 ctx.fillStyle='#fff';ctx.font=`62px ${J}`;ctx.fillText(`${c.emoji} ${c.name} 기후 여행 준비 완료!`,56,98);
 ctx.font=`28px ${G}`;ctx.globalAlpha=.92;wrap(ctx,c.goal,58,142,W-110,34,1);ctx.globalAlpha=1;
 // stage
 const stage=await loadSvg(stageSVG(cl,o,moodOf(cl,o),state.gender),620,682);
 ctx.save();rr(ctx,56,196,620,682,28);ctx.clip();ctx.drawImage(stage,56,196,620,682);ctx.restore();
 rr(ctx,56,196,620,682,28);ctx.lineWidth=8;ctx.strokeStyle=c.color;ctx.stroke();
 // item list
 ctx.fillStyle='#1f2a37';ctx.font=`36px ${J}`;ctx.fillText('입은 옷',712,240);
 const ids=SLOT_ORDER.slice().sort((a,b)=>['head','face','neck','top','bottom','feet','hands','carry'].indexOf(a)-['head','face','neck','top','bottom','feet','hands','carry'].indexOf(b)).map(s=>o[s]).filter(Boolean);
 let y=268;
 if(!ids.length){ctx.font=`26px ${G}`;ctx.fillStyle='#6b625b';ctx.fillText('아직 아무것도 안 입었어요',712,y+40);}
 for(const id of ids){
  rr(ctx,708,y,316,72,16);ctx.fillStyle='#f3f7fb';ctx.fill();
  try{const im=await loadSvg(thumb(id),60,60);ctx.drawImage(im,716,y+6,60,60);}catch(e){}
  ctx.fillStyle='#1f2a37';ctx.font=`27px ${G}`;ctx.fillText(ITEM[id].name,790,y+46);
  y+=80;
 }
 // footer
 const st=starsOf(cl,o);for(let k=0;k<3;k++)star(ctx,110+k*84,960,36,k<st);
 ctx.fillStyle='#1f2a37';ctx.font=`40px ${J}`;ctx.fillText(state.name.trim()||'기후 탐험대원',380,975);
 rr(ctx,56,1030,W-112,190,22);ctx.lineWidth=4;ctx.setLineDash([12,10]);ctx.strokeStyle=c.color;ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle=c.color;ctx.font=`32px ${J}`;ctx.fillText(`${c.name} 기후 옷차림의 핵심`,86,1084);
 ctx.fillStyle='#1f2a37';ctx.font=`28px ${G}`;wrap(ctx,c.key,86,1130,W-172,38,2);
 const d=new Date();ctx.fillStyle='#8a8f98';ctx.font=`24px ${G}`;
 ctx.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}  기후 탐험대 옷 입히기 대작전`,56,1290);
 return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}
async function takePhoto(){
 const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),500);
 let blob;
 try{blob=await makePhoto();}catch(e){
  $('modalCard').innerHTML=`<h3>사진을 만들지 못했어요</h3><p>이 기기에서는 사진 만들기가 되지 않아요. 화면 캡처(스크린샷)로 저장해 주세요.</p><div class="modalBtns"><button class="btnMain" id="mClose">닫기</button></div>`;
  $('modal').hidden=false;$('mClose').onclick=closeModal;return;
 }
 const url=URL.createObjectURL(blob);const c=CL[state.cl];
 const fname=`기후옷입히기_${c.name}${state.name.trim()?'_'+state.name.trim().replace(/[\\/:*?"<>|]/g,''):''}.png`;
 $('modalCard').innerHTML=`<h3>📸 완성 사진</h3><img class="shot" id="shotImg" alt="${c.name} 기후 옷 입히기 완성 사진"><p class="tip" id="shotTip">사진이 잘 나왔나요? 아래 버튼으로 저장해요.</p>
 <div class="modalBtns"><button class="btnGhost" id="mClose">닫기</button><button class="btnMain" id="mSave">이미지 저장하기</button></div>`;
 $('shotImg').src=url;$('modal').hidden=false;$('mClose').onclick=closeModal;$('mSave').focus();
 $('mSave').onclick=async()=>{
  const tip=$('shotTip');
  const inClaude=!!(window.claude&&typeof window.claude.use==='function');
  // 1) Claude 안에서 열렸을 때
  if(inClaude){
   const dl=await dlP;
   if(dl){
    try{await dl.save({filename:fname,data:blob});tip.textContent='저장했어요! 다운로드 폴더(또는 사진 앱)를 확인해 보세요.';return;}
    catch(e){if(e&&e.code==='declined'){tip.textContent='저장을 취소했어요.';return;}}
   }
  }
  // 2) 휴대폰·태블릿: 공유 창으로 사진 앱에 저장
  const file=new File([blob],fname,{type:'image/png'});
  const touch=matchMedia('(pointer:coarse)').matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'기후 옷 입히기 완성 사진'});tip.textContent='공유 창에서 "이미지 저장"을 누르면 사진 앱에 저장돼요.';return;}
   catch(e){if(e&&e.name==='AbortError'){tip.textContent='저장을 취소했어요.';return;}}
  }
  // 3) 컴퓨터(크롬북 포함): 바로 다운로드
  try{
   const a=document.createElement('a');a.href=url;a.download=fname;a.rel='noopener';
   document.body.appendChild(a);a.click();a.remove();
   tip.textContent='저장했어요! 다운로드 폴더를 확인해 보세요.';
  }catch(e){
   tip.textContent='자동 저장이 막혀 있어요. 사진을 길게 누르거나 오른쪽 클릭해서 "이미지 저장"을 눌러 주세요.';
  }
 };
}
$('shotBtn').onclick=takePhoto;

$('clearStars').onclick=()=>{state.stars={};saveStars();renderChips();};

/* ---------- quiz ---------- */
const PRESET={
 tr:{head:'strawhat',top:'tshirt',bottom:'shorts',feet:'sandals',carry:'umbrella'},
 dr:{head:'turban',face:'facecloth',top:'robe',feet:'sandals',carry:'water'},
 te:{head:'cap',top:'cardigan',bottom:'jeans',feet:'sneakers'},
 co:{head:'beanie',neck:'muffler',top:'padding',bottom:'quilted',feet:'furboots',hands:'mittens'},
 po:{head:'furhood',face:'goggles',top:'parka',bottom:'furpants',feet:'furboots',hands:'mittens'},
 hi:{head:'chullo',top:'poncho',bottom:'jeans',feet:'hiking'}
};
const Q={order:[],i:0,right:0,done:false};
function startQuiz(){Q.order=[...CL_ORDER].sort(()=>Math.random()-.5);Q.i=0;Q.right=0;showQ();}
function showQ(){
 Q.done=false;const k=Q.order[Q.i];
 $('qstage').innerHTML=stageSVG('q',PRESET[k],'happy',Math.random()<.5?'g':'b');
 $('qprog').textContent=`${Q.i+1} / ${Q.order.length}`;
 $('qopts').innerHTML=CL_ORDER.map(c=>`<button data-c="${c}">${CL[c].emoji} ${CL[c].name}</button>`).join('');
 $('qfeed').innerHTML='';$('qnext').hidden=true;
}
$('qopts').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||Q.done)return;Q.done=true;
 const k=Q.order[Q.i],ok=b.dataset.c===k;if(ok)Q.right++;
 $('qopts').querySelectorAll('button').forEach(x=>{if(x.dataset.c===k)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
 const names=Object.values(PRESET[k]).map(id=>ITEM[id].name).join(', ');
 $('qfeed').innerHTML=`<div class="box" style="border-color:${CL[k].color}"><b style="color:${CL[k].color}">${ok?'정답이에요!':'아쉬워요!'} ${CL[k].name} 기후의 여행자예요.</b>옷차림: ${names}<br>${CL[k].key}</div>`;
 const last=Q.i===Q.order.length-1;
 $('qnext').textContent=last?`결과 보기 (${Q.right}/${Q.order.length})`:'다음 여행자';$('qnext').hidden=false;$('qnext').focus();
});
$('qnext').onclick=()=>{
 if(Q.i<Q.order.length-1){Q.i++;showQ();return;}
 $('qfeed').innerHTML=`<div class="box" style="border-color:var(--navy)"><b style="color:var(--ink)">${Q.order.length}명 중 ${Q.right}명의 고향을 맞혔어요!</b>${Q.right===Q.order.length?'기후 박사 인정! 🎉':'틀린 기후는 옷 입히기 미션에서 다시 확인해 봐요.'}</div>`;
 $('qnext').textContent='처음부터 다시';$('qnext').onclick=()=>{$('qnext').onclick=nextHandler;startQuiz();};
};
const nextHandler=$('qnext').onclick;

function setMode(m){
 $('missionView').hidden=m!=='mission';$('quizView').hidden=m!=='quiz';
 $('modeMission').setAttribute('aria-pressed',m==='mission');$('modeQuiz').setAttribute('aria-pressed',m==='quiz');
 if(m==='quiz')startQuiz();
}
$('modeMission').onclick=()=>setMode('mission');
$('modeQuiz').onclick=()=>setMode('quiz');

renderAll();
</script>
